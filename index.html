<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarkov USD Rates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #1a1c16;
      --bg-panel: #24281e;
      --bg-inset: #161810;
      --olive: #6b7a3a;
      --olive-bright: #9aad4a;
      --sand: #c4b896;
      --sand-dim: #8a7f62;
      --rust: #c45a2a;
      --good: #7cb342;
      --warn: #d4a017;
      --bad: #c45a2a;
      --line: #3a4030;
      --text: #e8e2d4;
      --muted: #9a927e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #2a3218 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #2a2018 0%, transparent 50%),
        linear-gradient(165deg, #1e2218 0%, var(--bg-deep) 45%, #141610 100%);
      padding: 2.5rem 1.25rem 4rem;
    }

    .wrap { max-width: 1180px; margin: 0 auto; }

    header { margin-bottom: 1rem; animation: rise 0.55s ease-out both; }

    header h1 { margin-bottom: 0; }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--olive-bright);
      margin-bottom: 0.55rem;
    }

    h1 {
      font-family: Oswald, sans-serif;
      font-weight: 600;
      font-size: clamp(2.1rem, 6vw, 3rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--sand);
    }

    .lede {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
      max-width: 40em;
    }

    section { margin-top: 1.25rem; animation: rise 0.55s ease-out 0.1s both; }

    section:first-of-type { margin-top: 0; }

    .tier-note {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 0.75rem;
    }

    .tier-note strong {
      color: var(--sand);
      font-weight: 500;
    }

    .calc-panel {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      padding: 1rem 1.05rem 1.05rem;
      margin-bottom: 1rem;
    }

    .calc-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem 1rem;
      margin-bottom: 0.85rem;
    }

    .calc-title {
      font-family: Oswald, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sand);
    }

    .mode-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      background: var(--bg-inset);
    }

    .mode-toggle button {
      border: 0;
      border-radius: 0;
      padding: 0.4rem 0.75rem;
      font-family: Oswald, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sand-dim);
      background: transparent;
    }

    .mode-toggle button:hover {
      color: var(--sand);
      border-color: transparent;
    }

    .mode-toggle button.active {
      color: var(--bg-deep);
      background: var(--olive-bright);
    }

    .calc-controls {
      display: grid;
      grid-template-columns: minmax(5.5rem, 7.5rem) 1fr;
      gap: 0.75rem;
      align-items: end;
      margin-bottom: 0.85rem;
    }

    .calc-controls .unit {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sand-dim);
      margin-bottom: 0.3rem;
    }

    .calc-controls input[type="number"] {
      font-family: Oswald, sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.55rem;
    }

    .calc-slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .calc-slider-wrap .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: var(--muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 0.35rem;
      background: var(--line);
      border-radius: 0;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 1.05rem;
      height: 1.05rem;
      background: var(--olive-bright);
      border: 2px solid var(--sand);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 1.05rem;
      height: 1.05rem;
      background: var(--olive-bright);
      border: 2px solid var(--sand);
      cursor: pointer;
    }

    .calc-zones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
    }

    .calc-zones .buy-zone {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      grid-template-columns: none;
      padding: 0.5rem 0.55rem;
    }

    .calc-zones .buy-zone .zone-price {
      font-family: Oswald, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .calc-zones .buy-zone .zone-rate {
      grid-column: auto;
      font-size: 0.62rem;
    }

    @media (max-width: 720px) {
      .calc-zones {
        grid-template-columns: repeat(2, 1fr);
      }
      .calc-controls {
        grid-template-columns: 1fr;
      }
    }

    h2 {
      font-family: Oswald, sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--olive-bright);
      margin-bottom: 0.85rem;
      font-weight: 500;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .panel {
      padding: 1.15rem;
      background: var(--bg-panel);
      border: 1px solid var(--line);
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sand-dim);
    }

    input[type="number"],
    input[type="text"] {
      background: var(--bg-inset);
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      padding: 0.45rem 0.55rem;
      width: 100%;
    }

    input:focus {
      outline: 1px solid var(--olive-bright);
      border-color: var(--olive-bright);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .rate-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      align-items: start;
    }

    .rate-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.25rem 1rem;
      align-items: start;
      padding: 0.85rem 1rem;
      background: var(--bg-panel);
      border: 1px solid var(--line);
    }

    .rate-row.best {
      border-color: var(--good);
      box-shadow: inset 3px 0 0 var(--good);
    }

    .rate-row.ref {
      background: var(--bg-inset);
    }

    .rate-row .name {
      font-family: Oswald, sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .rate-row .detail {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .rate-row .ratio {
      font-family: Oswald, sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      color: var(--sand);
      text-align: right;
      white-space: nowrap;
    }

    .rate-row .ratio-unit {
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      color: var(--sand-dim);
      letter-spacing: 0.08em;
      margin-top: 0.1rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--good);
      margin-left: 0.45rem;
      vertical-align: middle;
    }

    .badge.warn { color: var(--warn); }

    .rate-row.baseline {
      border-color: var(--warn);
      box-shadow: inset 3px 0 0 var(--warn);
    }

    .item-ratio {
      margin: 1rem 0 0.85rem;
      padding: 1rem;
      background: var(--bg-inset);
      border-left: 3px solid var(--olive);
    }

    .item-ratio .big {
      font-family: Oswald, sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      letter-spacing: 0.03em;
      color: var(--sand);
    }

    .item-ratio .big span {
      font-size: 0.55em;
      color: var(--sand-dim);
      letter-spacing: 0.06em;
    }

    .verdict {
      font-family: Oswald, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.35;
      margin-bottom: 0.85rem;
    }

    .verdict.pk { color: var(--good); }
    .verdict.flea { color: var(--olive-bright); }
    .verdict.tie { color: var(--warn); }

    .compare-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .compare-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.35rem 0.85rem;
      padding: 0.7rem 0.85rem;
      background: var(--bg-inset);
      border: 1px solid transparent;
      font-size: 0.8rem;
    }

    .compare-row.best {
      border-color: var(--good);
      box-shadow: inset 3px 0 0 var(--good);
    }

    .compare-row .usd {
      font-family: Oswald, sans-serif;
      font-size: 1.15rem;
      color: var(--sand);
    }

    .compare-row .rate-mini {
      color: var(--muted);
      font-size: 0.72rem;
      text-align: right;
      align-self: center;
    }

    .compare-row .sub {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .vs.better { color: var(--good); }
    .vs.worse { color: var(--bad); }
    .vs.same { color: var(--warn); }

    form.add {
      margin-top: 1.25rem;
      padding: 1.15rem;
      background: var(--bg-panel);
      border: 1px dashed var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }

    form.add .span-full { grid-column: 1 / -1; }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--bg-inset);
      color: var(--muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    button:hover { color: var(--text); border-color: var(--sand-dim); }

    button.primary {
      background: var(--olive);
      border-color: var(--olive);
      color: #12140e;
      font-weight: 600;
    }

    button.primary:hover {
      background: var(--olive-bright);
      border-color: var(--olive-bright);
    }

    button.danger:hover { color: var(--rust); border-color: var(--rust); }

    .row-actions { margin-top: 0.35rem; }

    .insight {
      margin-top: 1rem;
      padding: 1rem 1.1rem;
      background: var(--bg-inset);
      border-left: 3px solid var(--warn);
    }

    .insight strong {
      font-family: Oswald, sans-serif;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--sand);
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .insight p {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .insight .figure {
      color: var(--olive-bright);
      font-family: Oswald, sans-serif;
      font-size: 1.25rem;
    }

    .empty { color: var(--muted); font-size: 0.85rem; padding: 0.5rem 0; }

    .buy-guide {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      align-items: start;
    }

    .buy-card {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      padding: 0.9rem 0.95rem 0.85rem;
      height: 100%;
    }

    .buy-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.55rem;
    }

    .buy-card-head .name {
      font-family: Oswald, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--sand);
      line-height: 1.2;
    }

    .buy-card-head .meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .pk-payout {
      text-align: right;
      white-space: nowrap;
    }

    .pk-payout .amount {
      font-family: Oswald, sans-serif;
      font-size: 1.4rem;
      color: var(--olive-bright);
      letter-spacing: 0.02em;
    }

    .pk-payout .label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sand-dim);
      margin-top: 0.1rem;
    }

    .buy-breakeven {
      padding: 0.55rem 0.6rem;
      background: var(--bg-inset);
      border-left: 3px solid var(--warn);
    }

    .buy-breakeven .be-price {
      font-family: Oswald, sans-serif;
      font-size: 1.15rem;
      color: var(--warn);
      letter-spacing: 0.02em;
    }

    .buy-breakeven .be-hint {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.2rem;
      line-height: 1.35;
    }

    .card-more {
      display: block;
      width: 100%;
      margin-top: 0.55rem;
      padding: 0.35rem 0.5rem;
      font-family: Oswald, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sand-dim);
      border-color: transparent;
      background: transparent;
    }

    .card-more:hover {
      color: var(--sand);
      border-color: var(--line);
    }

    .buy-card.is-open .card-more {
      color: var(--olive-bright);
    }

    .buy-zones {
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }

    .buy-card.is-open .buy-zones {
      display: flex;
    }

    .buy-zone {
      display: grid;
      grid-template-columns: 4.25rem 1fr;
      gap: 0.15rem 0.5rem;
      align-items: center;
      padding: 0.4rem 0.5rem;
      font-size: 0.72rem;
      background: var(--bg-inset);
      border-left: 3px solid var(--line);
    }

    .buy-zone .zone-label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .buy-zone .zone-price {
      color: var(--text);
    }

    .buy-zone .zone-rate {
      grid-column: 2;
      color: var(--muted);
      font-size: 0.65rem;
      text-align: left;
    }

    .buy-zone.excellent { border-left-color: var(--good); }
    .buy-zone.excellent .zone-label { color: var(--good); }

    .buy-zone.good { border-left-color: var(--olive-bright); }
    .buy-zone.good .zone-label { color: var(--olive-bright); }

    .buy-zone.ok { border-left-color: var(--warn); }
    .buy-zone.ok .zone-label { color: var(--warn); }

    .buy-zone.bad { border-left-color: var(--bad); }
    .buy-zone.bad .zone-label { color: var(--bad); }

    .more-wrap {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.15rem 0 0.1rem;
    }

    .more-wrap button {
      font-family: Oswald, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.55rem 1.4rem;
      color: var(--sand);
      border-color: var(--line);
      background: var(--bg-inset);
    }

    .more-wrap button:hover {
      border-color: var(--olive-bright);
      color: var(--olive-bright);
    }

    .buy-guide.collapsed .buy-card.extra,
    .buy-guide.glasses-collapsed .buy-card.glasses {
      display: none;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.7rem;
      color: var(--sand-dim);
      letter-spacing: 0.06em;
    }

    @media (max-width: 960px) {
      .buy-guide {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .buy-guide {
        grid-template-columns: 1fr;
      }
      .grid-2, form.add { grid-template-columns: 1fr; }
      form.add button.primary { grid-column: 1; }
      .compare-row {
        grid-template-columns: 1fr auto;
      }
      .compare-row .rate-mini {
        grid-column: 1 / -1;
        text-align: left;
      }
      .buy-card-head .name { font-size: 1.1rem; }
      .pk-payout .amount { font-size: 1.55rem; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>USD conversion rates</h1>
    </header>

    <section>
      <div class="calc-panel" id="calc-panel">
        <div class="calc-top">
          <div class="calc-title">Quick thresholds</div>
          <div class="mode-toggle" role="group" aria-label="Calculator mode">
            <button type="button" id="mode-usd" class="active">USD → ₽</button>
            <button type="button" id="mode-rub">₽ → USD</button>
          </div>
        </div>
        <div class="calc-controls">
          <div>
            <div class="unit" id="calc-unit">Peacekeeper pays ($)</div>
            <input type="number" id="calc-amount" min="1" step="1" value="100" />
          </div>
          <div class="calc-slider-wrap">
            <input type="range" id="calc-slider" min="1" max="2500" step="1" value="100" />
            <div class="range-labels">
              <span id="calc-min-label">$1</span>
              <span id="calc-max-label">$500</span>
            </div>
          </div>
        </div>
        <div class="calc-zones" id="calc-zones"></div>
      </div>

      <p class="tier-note">
        Buy at or under Okay (~187 ₽/$) to match Peacekeeper.
        Expand a card for Excellent / Good / Okay tiers.
      </p>
      <div class="buy-guide collapsed glasses-collapsed" id="buy-guide"></div>
    </section>

    <footer>Saved in this browser</footer>
  </div>

      {

      {

    const DEFAULTS = {

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULTS);
        const data = JSON.parse(raw);
        return {
          routes: Array.isArray(data.routes) ? data.routes : structuredClone(DEFAULTS.routes),
        };
      } catch {
        return structuredClone(DEFAULTS);
      }
    }

    function save(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function fmt(n, digits = 2) {
      return Number(n).toLocaleString("en-US", {
        maximumFractionDigits: digits,
        minimumFractionDigits: Number.isInteger(n) ? 0 : undefined,
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buyZonesForItem(usd, baseline) {
      const excellent = Math.floor(usd * RATE_EXCELLENT);
      const ok = Math.floor(usd * baseline);
      return [
        {
          kind: "excellent",
          label: "Excellent",
          price: `≤ ${fmt(excellent, 0)} ₽`,
          rate: `~${RATE_EXCELLENT} ₽/$`,
        },
        {
          kind: "good",
          label: "Good",
          price: `${fmt(excellent + 1, 0)} – ${fmt(ok, 0)} ₽`,
          rate: `up to ${baseline} ₽/$`,
        },
        {
          kind: "ok",
          label: "Okay",
          price: `${fmt(ok, 0)} ₽`,
          rate: `= PK (${baseline} ₽/$)`,
        },
      ];
    }

    function catalogUsd(item) {
      const route = findRoute(item.id, item.name);
      return route?.usd > 0 ? route.usd : item.usd;
    }

    let state = load();

    function ensureCatalogRoutes() {
      let changed = false;
      for (const def of DEFAULTS.routes) {
        const existing = state.routes.find((r) => r.id === def.id);
        if (!existing) {
          state.routes.push(structuredClone(def));
          changed = true;
          continue;
        }
        const catalog = CATALOG.find((c) => c.id === def.id);
        if (catalog && existing.usd !== catalog.usd) {
          existing.usd = catalog.usd;
          changed = true;
        }
      }
      if (changed) save(state);
    }

    ensureCatalogRoutes();

    const buyGuideEl = document.getElementById("buy-guide");
    const calcAmountEl = document.getElementById("calc-amount");
    const calcSliderEl = document.getElementById("calc-slider");
    const calcZonesEl = document.getElementById("calc-zones");
    const calcUnitEl = document.getElementById("calc-unit");
    const calcMinLabel = document.getElementById("calc-min-label");
    const calcMaxLabel = document.getElementById("calc-max-label");
    const modeUsdBtn = document.getElementById("mode-usd");
    const modeRubBtn = document.getElementById("mode-rub");

    let calcMode = "usd"; // "usd" | "rub"
    let calcAmount = 100;

    const CALC_RANGES = {
      usd: { min: 1, max: 2500, step: 1, default: 100 },
      rub: { min: 500, max: 500000, step: 100, default: 20000 },
    };

    function findRoute(...matchers) {
      return state.routes.find((r) =>
        matchers.some(
          (m) =>
            r.id === m ||
            (r.name || "").toLowerCase().includes(String(m).toLowerCase())
        )
      );
    }

    function zonesFromUsd(usd) {
      return buyZonesForItem(usd, PK_BASELINE);
    }

    function zonesFromRubles(rubles) {
      const excellent = Math.ceil(rubles / RATE_EXCELLENT);
      const ok = Math.ceil(rubles / PK_BASELINE);
      return [
        {
          kind: "excellent",
          label: "Excellent",
          price: `≥ $${fmt(excellent, 0)}`,
          rate: `~${RATE_EXCELLENT} ₽/$`,
        },
        {
          kind: "good",
          label: "Good",
          price: `$${fmt(ok, 0)} – $${fmt(Math.max(ok, excellent - 1), 0)}`,
          rate: `up to ${PK_BASELINE} ₽/$`,
        },
        {
          kind: "ok",
          label: "Okay",
          price: `$${fmt(ok, 0)}`,
          rate: `= PK (${PK_BASELINE} ₽/$)`,
        },
      ];
    }

    function applyCalcRange() {
      const range = CALC_RANGES[calcMode];
      calcAmountEl.min = 1;
      calcAmountEl.removeAttribute("max");
      calcAmountEl.step = range.step;
      calcSliderEl.min = range.min;
      calcSliderEl.max = range.max;
      calcSliderEl.step = range.step;
      if (calcMode === "usd") {
        calcUnitEl.textContent = "Peacekeeper pays ($)";
        calcMinLabel.textContent = `$${fmt(range.min, 0)}`;
        calcMaxLabel.textContent = `$${fmt(range.max, 0)}`;
      } else {
        calcUnitEl.textContent = "Flea buy (₽)";
        calcMinLabel.textContent = `${fmt(range.min, 0)} ₽`;
        calcMaxLabel.textContent = `${fmt(range.max, 0)} ₽`;
      }
    }

    function setCalcAmount(value, syncInputs = true) {
      const range = CALC_RANGES[calcMode];
      const n = Number(value);
      calcAmount = Number.isFinite(n) && n > 0 ? n : range.default;
      if (syncInputs) {
        calcAmountEl.value = String(Math.round(calcAmount));
        calcSliderEl.value = String(
          Math.min(range.max, Math.max(range.min, Math.round(calcAmount)))
        );
      }
      renderCalcZones();
    }

    function setCalcMode(mode) {
      if (mode === calcMode) return;
      calcMode = mode;
      modeUsdBtn.classList.toggle("active", mode === "usd");
      modeRubBtn.classList.toggle("active", mode === "rub");
      calcAmount = CALC_RANGES[mode].default;
      applyCalcRange();
      setCalcAmount(calcAmount);
    }

    function renderCalcZones() {
      const zones =
        calcMode === "usd"
          ? zonesFromUsd(calcAmount)
          : zonesFromRubles(calcAmount);
      calcZonesEl.innerHTML = zones
        .map(
          (z) => `
        <div class="buy-zone ${z.kind}">
          <span class="zone-label">${escapeHtml(z.label)}</span>
          <span class="zone-price">${escapeHtml(z.price)}</span>
          <span class="zone-rate">${escapeHtml(z.rate)}</span>
        </div>
      `
        )
        .join("");
    }

    function wireCalc() {
      applyCalcRange();
      setCalcAmount(calcAmount);

      modeUsdBtn.addEventListener("click", () => setCalcMode("usd"));
      modeRubBtn.addEventListener("click", () => setCalcMode("rub"));

      calcSliderEl.addEventListener("input", () => {
        setCalcAmount(calcSliderEl.value);
      });

      calcAmountEl.addEventListener("input", () => {
        const n = Number(calcAmountEl.value);
        if (!Number.isFinite(n)) return;
        calcAmount = n;
        calcSliderEl.value = String(
          Math.min(
            CALC_RANGES[calcMode].max,
            Math.max(CALC_RANGES[calcMode].min, Math.round(n))
          )
        );
        renderCalcZones();
      });

      calcAmountEl.addEventListener("change", () => {
        setCalcAmount(calcAmountEl.value);
      });
    }

    function renderCard(item, extraClass) {
      const usd = catalogUsd(item);
      const breakeven = Math.floor(usd * PK_BASELINE);
      const zones = buyZonesForItem(usd, PK_BASELINE);
      return `
        <article class="buy-card${extraClass ? ` ${extraClass}` : ""}" data-id="${escapeHtml(item.id)}">
          <div class="buy-card-head">
            <div>
              <div class="name">${escapeHtml(item.name)}</div>
              <div class="meta">${escapeHtml(item.slot)} · flea buy → Peacekeeper sell</div>
            </div>
            <div class="pk-payout">
              <div class="amount">$${fmt(usd)}</div>
              <span class="label">Peacekeeper pays</span>
            </div>
          </div>
          <div class="buy-breakeven">
            <div class="be-price">≤ ${fmt(breakeven, 0)} ₽</div>
            <div class="be-hint">Break-even vs PK · buy under this</div>
          </div>
          <button type="button" class="card-more" aria-expanded="false">More tiers</button>
          <div class="buy-zones">
            ${zones
              .map(
                (z) => `
              <div class="buy-zone ${z.kind}">
                <span class="zone-label">${escapeHtml(z.label)}</span>
                <span class="zone-price">${escapeHtml(z.price)}</span>
                <span class="zone-rate">${escapeHtml(z.rate)}</span>
              </div>
            `
              )
              .join("")}
          </div>
        </article>
      `;
    }

    function renderBuyGuide() {
      const featured = FEATURED_IDS.map((id) =>
        CATALOG.find((item) => item.id === id)
      ).filter(Boolean);
      const extras = CATALOG.filter(
        (item) =>
          !FEATURED_IDS.includes(item.id) && item.group !== "glasses"
      );
      const glasses = CATALOG.filter((item) => item.group === "glasses");
      const extraCount = extras.length;
      const glassesCount = glasses.length;

      buyGuideEl.innerHTML =
        featured.map((item) => renderCard(item, "")).join("") +
        `<div class="more-wrap">
          ${
            extraCount
              ? `<button type="button" id="more-btn" aria-expanded="false">
                  More items · ${extraCount}
                </button>`
              : ""
          }
          ${
            glassesCount
              ? `<button type="button" id="glasses-btn" aria-expanded="false">
                  Glasses · ${glassesCount}
                </button>`
              : ""
          }
        </div>` +
        extras.map((item) => renderCard(item, "extra")).join("") +
        glasses.map((item) => renderCard(item, "glasses")).join("");

      const moreBtn = document.getElementById("more-btn");
      if (moreBtn) {
        moreBtn.addEventListener("click", () => {
          const expanded = buyGuideEl.classList.toggle("collapsed") === false;
          moreBtn.setAttribute("aria-expanded", String(expanded));
          moreBtn.textContent = expanded
            ? "Fewer items"
            : `More items · ${extraCount}`;
        });
      }

      const glassesBtn = document.getElementById("glasses-btn");
      if (glassesBtn) {
        glassesBtn.addEventListener("click", () => {
          const expanded =
            buyGuideEl.classList.toggle("glasses-collapsed") === false;
          glassesBtn.setAttribute("aria-expanded", String(expanded));
          glassesBtn.textContent = expanded
            ? "Hide glasses"
            : `Glasses · ${glassesCount}`;
        });
      }

      buyGuideEl.querySelectorAll(".card-more").forEach((btn) => {
        btn.addEventListener("click", () => {
          const card = btn.closest(".buy-card");
          const open = card.classList.toggle("is-open");
          btn.setAttribute("aria-expanded", String(open));
          btn.textContent = open ? "Hide tiers" : "More tiers";
        });
      });
    }

    function render() {
      wireCalc();
      renderBuyGuide();
    }

    render();
  </script>
